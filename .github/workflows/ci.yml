name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ibimina-hub:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 3000:3000 ibimina-hub:${{ github.sha }}
          for i in $(seq 1 10); do
            curl -fs http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
