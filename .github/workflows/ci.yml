name: CI

on:
  pull_request:
    branches: [main, summative]
  push:
    branches-ignore: [main]
  # cd.yml calls this file, so main runs exactly the same checks before a deploy.
  workflow_call:

permissions:
  contents: read

concurrency:
  # The caller's workflow name keeps a CD run from cancelling (or being
  # cancelled by) a plain CI run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      # -backend=false: downloads providers only, needs no Azure credentials.
      # Both roots: bootstrap (state store + CD identity) and envs/dev.
      - name: Init and validate
        run: |
          for dir in terraform/bootstrap terraform/envs/dev; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: pip install "ansible-core>=2.17,<2.18" "ansible-lint>=24,<26"

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: ansible-playbook site.yml --syntax-check -i localhost,

      # production profile (.ansible-lint): FQCNs, no shell where a module exists,
      # named tasks, file modes set, no_log on secrets...
      - name: Lint
        run: ansible-lint

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ibimina-hub:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 3000:3000 ibimina-hub:${{ github.sha }}
          for i in $(seq 1 10); do
            curl -fs http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
