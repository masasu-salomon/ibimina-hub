---
# Configures the VM that Terraform created and deploys the API on it.
#   ansible-playbook site.yml                    full run
#   ansible-playbook site.yml --tags app         redeploy the container only
#   ansible-playbook site.yml --check --diff     dry run, shows file changes
- name: Configure the ibimina-hub server
  hosts: app
  become: true
  gather_facts: true

  pre_tasks:
    - name: Check the server runs a supported Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_major_version'] is version('22', '>=')
        fail_msg: "These roles are written for Ubuntu 22.04+, found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}."
        quiet: true
      tags: always

  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: docker
      tags: [docker]
    - role: app
      tags: [app]
