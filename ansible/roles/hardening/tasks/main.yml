---
# ---------- Safety checks: stop before anything that could lock us out ----------
- name: Refuse to change the firewall when admin_cidrs is empty
  ansible.builtin.assert:
    that:
      - admin_cidrs is defined
      - admin_cidrs is iterable
      - admin_cidrs is not string
      - admin_cidrs | length > 0
    fail_msg: >-
      admin_cidrs is empty, so UFW would block SSH and lock you out.
      Set it to your public IP in CIDR form (find it with: curl ifconfig.me), e.g.
      -e '{"admin_cidrs": ["203.0.113.10/32"]}'. Use the same value as admin_cidrs in terraform.
    quiet: true

- name: Check every admin CIDR is a valid IPv4 range and not the whole internet
  ansible.builtin.assert:
    that:
      - admin_cidrs | reject('match', '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$') | list | length == 0
      - "'0.0.0.0/0' not in admin_cidrs"
    fail_msg: "admin_cidrs must be IPv4 CIDRs like 203.0.113.10/32, and 0.0.0.0/0 is not allowed. Got: {{ admin_cidrs }}"
    quiet: true

- name: Check the user Ansible logs in as will still be allowed to SSH in
  ansible.builtin.assert:
    that:
      - (ansible_user | default('azureuser')) in hardening_ssh_allow_users
    fail_msg: >-
      {{ ansible_user | default('azureuser') }} is not in hardening_ssh_allow_users
      ({{ hardening_ssh_allow_users }}), so the next run could not log in.
    quiet: true

# ---------- SSH ----------
- name: Make sure sshd reads the drop-in folder
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Install the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: sshd -t -f %s
  notify: Restart ssh

# ---------- Host firewall (UFW) ----------
# UFW re-applies /etc/ufw/sysctl.conf every time it reloads (e.g. when the
# default policy is set), and that file turns log_martians off. Make it agree
# with our sysctl hardening, or every run flips the value back and forth and
# the play is never changed=0.
- name: Keep UFW from turning off martian packet logging
  ansible.builtin.lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: '^#?\s*net/ipv4/conf/{{ item }}/log_martians\s*='
    line: "net/ipv4/conf/{{ item }}/log_martians=1"
  loop:
    - all
    - default

# SSH is allowed BEFORE the firewall is switched on, so the session survives.
- name: Allow SSH only from the admin CIDRs
  community.general.ufw:
    rule: allow
    port: "{{ hardening_ssh_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: SSH from admin
  loop: "{{ admin_cidrs }}"

- name: Allow the app port
  community.general.ufw:
    rule: allow
    port: "{{ app_port | string }}"
    proto: tcp
    comment: ibimina-hub API

- name: Deny incoming and allow outgoing traffic by default
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  loop_control:
    label: "{{ item.direction }} {{ item.policy }}"

- name: Log blocked connections
  community.general.ufw:
    logging: "{{ hardening_ufw_logging }}"

- name: Switch the firewall on
  community.general.ufw:
    state: enabled

# ---------- fail2ban ----------
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    lock_timeout: 300

- name: Configure the fail2ban sshd jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban and enable it at boot
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true

# ---------- Kernel network hardening ----------
- name: Apply sysctl network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    sysctl_file: "{{ hardening_sysctl_file }}"
    state: present
    reload: true
  loop: "{{ hardening_sysctl_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
