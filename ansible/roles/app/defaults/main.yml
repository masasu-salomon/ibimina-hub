---
# group_vars and the Terraform inventory set these too and win; they are here so
# the role works on its own.
app_image: ""
app_tag: latest
app_port: 3000

app_container_name: ibimina-hub
# Port the API listens on inside the image (PORT in the Dockerfile).
app_container_port: 3000

# Where the compose project lives on the VM: compose.yaml + .env (root only).
app_dir: /opt/ibimina-hub
app_compose_project: ibimina-hub

# ---------- Private registry (ACR) ----------
# Set by the Terraform inventory. When app_acr_login_server is set, the VM logs in
# with its managed identity (no stored password): metadata-endpoint token ->
# ACR refresh token -> docker login.
app_acr_login_server: ""
app_azure_tenant_id: ""
# Fixed user name ACR expects with a refresh token.
app_acr_token_username: 00000000-0000-0000-0000-000000000000
# A new VM's AcrPull role can take a few minutes to reach ACR.
app_acr_login_retries: 20
app_acr_login_delay: 15

# ---------- Settings passed to the container (.env) ----------
# Plain settings.
app_env:
  NODE_ENV: production
  PORT: "{{ app_container_port | string }}"
  LOG_LEVEL: info
# Connection URL of the managed PostgreSQL (Terraform output database_url, set by
# the inventory). Empty = the app keeps its in-memory store.
app_database_url: ""
# Other secret settings (e.g. from ansible-vault).
app_secret_env: {}

# Resource limits: one leaky request can't take the whole VM down.
app_memory: 256m
app_pids_limit: 100
app_tmpfs_size: 64m

app_health_path: /health
# 12 tries x 5 s = up to one minute for the API to come up.
app_health_retries: 12
app_health_delay: 5

# Delete untagged old images before deploying (the running one is kept for rollback).
app_prune_dangling_images: true
