---
# A fresh Azure VM is still running cloud-init (and apt) for a minute or two
# after it boots. Waiting avoids "could not get apt lock" errors on run 1.
- name: Wait for cloud-init to finish first-boot setup
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Refresh the apt cache if it is older than an hour
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: "{{ common_apt_lock_timeout }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    lock_timeout: "{{ common_apt_lock_timeout }}"

- name: Turn on daily automatic security updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  notify: Restart unattended-upgrades

- name: Clean up old packages after updates and never auto-reboot
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"
  notify: Restart unattended-upgrades

- name: Make sure the unattended-upgrades service is running
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    state: started
    enabled: true

- name: Set the time zone to {{ common_timezone }}
  community.general.timezone:
    name: "{{ common_timezone }}"
