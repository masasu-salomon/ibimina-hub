# Ansible settings for this project. Run commands from inside ansible/.
#
# WSL note: folders under /mnt/c are world-writable, and Ansible refuses to
# read an ansible.cfg from a world-writable folder. Point at it explicitly:
#   export ANSIBLE_CONFIG=$PWD/ansible.cfg

[defaults]
# A folder: Ansible loads every inventory source in it (here the Terraform
# script). *.ini files are skipped, so hosts.example.ini is never picked up.
inventory = inventory/
roles_path = roles
# The VM is new after every terraform apply, so its host key changes too.
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
forks = 10

[ssh_connection]
# Sends modules over the open SSH session instead of copying files: much faster.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
