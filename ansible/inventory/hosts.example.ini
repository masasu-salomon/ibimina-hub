# Static fallback inventory, for when Terraform state is not on your machine.
#   cp inventory/hosts.example.ini inventory/hosts.ini     (git-ignored)
#   edit hosts.ini, then run:
#   ansible-playbook -i inventory/hosts.ini site.yml
#
# Get the values from whoever ran terraform apply:
#   terraform -chdir=../terraform/envs/dev output public_ip
#   terraform -chdir=../terraform/envs/dev output ssh_user

[app]
ibimina-hub ansible_host=<VM_PUBLIC_IP> ansible_user=<SSH_USER>
